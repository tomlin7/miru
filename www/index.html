<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Miru — a GPU-accelerated comic reader for .cbz and .cbr</title>
    <meta
      name="description"
      content="Miru is a native, GPU-accelerated comic reader for .cbz and .cbr archives. Single page, two-page spread, or a continuous webtoon strip, with your library kept on your own disk."
    />
    <meta property="og:title" content="Miru — a GPU-accelerated comic reader" />
    <meta
      property="og:description"
      content="Read .cbz and .cbr archives in a native, GPU-rendered window. Three reading modes, manga and western reading directions, and a library that never leaves your disk."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./shots/reader-spread.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0b0b0e" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./app-icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
    />
    <script>
      // Set the theme before the first paint so the page never flashes, and
      // mark the document as scripted so the scroll entrances can hide their
      // start state.
      document.documentElement.classList.add('dark', 'js')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
